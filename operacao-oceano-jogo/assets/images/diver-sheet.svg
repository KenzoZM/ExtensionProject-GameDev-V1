<svg xmlns="http://www.w3.org/2000/svg" width="256" height="80" viewBox="0 0 256 80">
  <!-- Sprite sheet do mergulhador: 2 quadros de 128x80 (pernadas alternadas). Arte original. -->
  <defs>
    <g id="body">
      <!-- cilindro -->
      <rect x="40" y="14" width="38" height="16" rx="7" fill="#f2b705" stroke="#7a5200" stroke-width="2"/>
      <rect x="44" y="17" width="8" height="10" rx="2" fill="#ffd84d"/>
      <!-- tronco -->
      <path d="M34 30 Q60 24 92 30 L94 46 Q60 52 34 46 Z" fill="#1d4fa8" stroke="#0b2457" stroke-width="2"/>
      <rect x="60" y="28" width="5" height="20" fill="#f2b705"/>
      <!-- braço -->
      <path d="M86 40 L106 46" stroke="#1d4fa8" stroke-width="8" stroke-linecap="round"/>
      <circle cx="108" cy="47" r="5" fill="#f4c49a" stroke="#8a5a3c" stroke-width="1.5"/>
      <!-- cabeça e máscara -->
      <circle cx="102" cy="30" r="13" fill="#1d4fa8" stroke="#0b2457" stroke-width="2"/>
      <rect x="99" y="22" width="18" height="12" rx="4" fill="#9fe9ff" stroke="#f2b705" stroke-width="3"/>
      <rect x="103" y="25" width="5" height="3" fill="#ffffff"/>
      <path d="M101 38 L109 38" stroke="#f4c49a" stroke-width="3" stroke-linecap="round"/>
      <!-- regulador -->
      <path d="M96 40 Q86 34 78 22" stroke="#222" stroke-width="2.5" fill="none"/>
    </g>
  </defs>
  <!-- Quadro 0: pernas abertas -->
  <g>
    <use href="#body"/>
    <path d="M36 34 L16 26" stroke="#0b2457" stroke-width="9" stroke-linecap="round"/>
    <path d="M36 42 L16 50" stroke="#0b2457" stroke-width="9" stroke-linecap="round"/>
    <path d="M18 26 L2 14 L4 30 Z" fill="#f2b705" stroke="#7a5200" stroke-width="2"/>
    <path d="M18 50 L2 62 L4 46 Z" fill="#f2b705" stroke="#7a5200" stroke-width="2"/>
  </g>
  <!-- Quadro 1: pernas juntas -->
  <g transform="translate(128 0)">
    <use href="#body"/>
    <path d="M36 36 L14 34" stroke="#0b2457" stroke-width="9" stroke-linecap="round"/>
    <path d="M36 42 L14 44" stroke="#0b2457" stroke-width="9" stroke-linecap="round"/>
    <path d="M16 34 L0 28 L2 38 Z" fill="#f2b705" stroke="#7a5200" stroke-width="2"/>
    <path d="M16 44 L0 52 L2 42 Z" fill="#f2b705" stroke="#7a5200" stroke-width="2"/>
  </g>
</svg>
